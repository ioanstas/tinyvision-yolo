# YOLOv8n with P2 detection head for tiny objects
# Adds detection at stride 4 (160x160 feature map for 640 input)

# Parameters
nc: 7  # number of classes (RGBT-Tiny: ship, car, cyclist, pedestrian, bus, drone, plane)
scales:
  n: [0.33, 0.25, 1024]  # YOLOv8n scale: depth, width, max_channels

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2   (320x320)
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4   (160x160) <-- We'll use this
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8   (80x80)
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16  (40x40)
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32  (20x20)
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

# Head with P2 detection
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11 - cat P4
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14 - cat P3
  - [-1, 3, C2f, [256]]                         # 15 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 2], 1, Concat, [1]]                   # 17 - cat P2
  - [-1, 3, C2f, [128]]                         # 18 (P2/4) <-- NEW

  - [-1, 1, Conv, [128, 3, 2]]                  # 19
  - [[-1, 15], 1, Concat, [1]]                  # 20 - cat P3
  - [-1, 3, C2f, [256]]                         # 21 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                  # 23 - cat P4
  - [-1, 3, C2f, [512]]                         # 24 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                  # 25
  - [[-1, 9], 1, Concat, [1]]                   # 26 - cat P5
  - [-1, 3, C2f, [1024]]                        # 27 (P5/32)

  - [[18, 21, 24, 27], 1, Detect, [nc]]         # Detect at P2, P3, P4, P5
